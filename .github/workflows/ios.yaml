name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q WC_Khata.zip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add iOS permissions
        working-directory: WC_Khata
        run: |
          P=ios/Runner/Info.plist
          add() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$P" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$P"
          }
          add NSCameraUsageDescription "Camera is used to scan barcodes and take photos"
          add NSMicrophoneUsageDescription "Microphone is used for voice recording"
          add NSPhotoLibraryUsageDescription "Photos are used to pick images"
          add NSContactsUsageDescription "Contacts are used to add customers and suppliers"
          add NSFaceIDUsageDescription "Face ID is used to unlock the app"

      - name: Get packages
        working-directory: WC_Khata
        run: flutter pub get

      - name: Set iOS minimum version to 15.5
        working-directory: WC_Khata
        run: |
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --config-only --no-codesign || true
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^#? ?platform :ios, .*/platform :ios, '15.5'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile
          fi

      - name: Build iOS
        working-directory: WC_Khata
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: WC_Khata/build/ios/iphoneos/Runner.app
